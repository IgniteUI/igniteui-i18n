name: Npm.js deploy

on:
  release:
    types: [created]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      # Trusted publishing (OIDC) needs npm 11.5.1+, bundled since Node 24.5.
      # check-latest skips an older cached Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Prereleases go to `next`, e.g. 2.0.0-rc.1. Releases keep npm's default `latest`,
      # which npm refuses to move to a lower version, e.g. 1.0.7 after 2.0.0.
      - name: Define npm tag
        run: |
            if [[ "$VERSION" == *-* ]]; then echo "NPM_TAG=next" >> "$GITHUB_ENV"; fi
            echo "Publishing $VERSION"

      - run: npm ci

      - name: Build the package
        run: npm run build

      # Both packages ship as one release, so each pins the other to the exact version.
      - name: Version the core package
        run: npm pkg set version="$VERSION" peerDependencies.igniteui-i18n-resources="$VERSION"
        working-directory: dist/igniteui-i18n-core

      # Passes `--tag` only when NPM_TAG is set.
      - name: Publish the core package
        run: npm publish ${NPM_TAG:+--tag "$NPM_TAG"}
        working-directory: dist/igniteui-i18n-core

      - name: Version the resources package
        run: npm pkg set version="$VERSION" dependencies.igniteui-i18n-core="$VERSION"
        working-directory: dist/igniteui-i18n-resources

      - name: Publish the resources package
        run: npm publish ${NPM_TAG:+--tag "$NPM_TAG"}
        working-directory: dist/igniteui-i18n-resources

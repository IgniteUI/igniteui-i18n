# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node

name: Node.js CI

on:
  push:
    branches: [ master, '[0-9]+.[0-9]+.x' ]
  pull_request:
    branches: [ master, '[0-9]+.[0-9]+.x' ]

permissions:
  contents: read

# New pushes to a PR cancel its stale runs. Each branch push gets its own group,
# since GitHub drops queued runs within a group, and every commit needs CI and coverage.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  run-tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
            node-version: ${{ matrix.node-version }}
            cache: 'npm'
      - name: Install packages
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build Core & Resources
        run: npm run build
      - name: Check bundle
        run: npm run check:bundle
      - name: Install Playwright
        run: npx playwright install --with-deps --only-shell chromium
      - name: Test
        run: npm run test
      - name: Publish to coveralls.io
        if: github.repository == 'IgniteUI/igniteui-i18n' && matrix.node-version == '24.x'
        uses: coverallsapp/github-action@v2.3.8
        with:
            github-token: ${{ github.token }}
